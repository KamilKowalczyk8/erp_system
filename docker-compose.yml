services:
  postgres:
    image: postgres:16-alpine
    container_name: erp_database
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=erp_user
      - POSTGRES_PASSWORD=erp_password
      - POSTGRES_DB=erp_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: